<body>

<div class="app" id="app">
<aside class="side" id="side"></aside>
<main class="main" id="main">
<header class="top">
<div class="title"><span class="crumb">여남규 알아보기</span><span class="slash">/</span><span id="ttl"></span><svg class="i"><use href="#i-down"/></svg></div>
<div class="sp"></div>
<button class="tbtn"><svg class="i"><use href="#i-share"/></svg>공유</button>
<button class="tbtn pinbtn" id="pinToggle" title="핀 보드 열기"><svg class="i"><use href="#i-pin"/></svg>핀 보드<span class="cnt" id="pinCnt"></span></button>
</header>
<header class="mtop">
<button class="ibtn" id="mMenu" aria-label="메뉴"><svg class="i"><use href="#i-menu"/></svg></button>
<div class="title" id="mttl"></div>
<button class="ibtn plus" aria-label="새 채팅"><svg class="i"><use href="#i-plus"/></svg></button>
</header>
<div class="scroll" id="scroll">
<div class="coach" id="coach">
<span class="lbl">TRY IT</span>
<ol>
<li id="st1"><i>1</i>문장 드래그</li>
<li id="st2"><i>2</i>오른쪽 보드로 끌거나 「핀」</li>
<li id="st3"><i>3</i>핀의 링크로 원래 대화로</li>
</ol>
<button class="again" id="coachAgain">사용법 다시 보기</button>
<button class="x" id="coachX" aria-label="닫기"><svg class="i"><use href="#i-x"/></svg></button>
</div>
<div class="thread" id="thread"></div>
</div>
<div class="composer">
<div class="box">
<textarea id="inp" placeholder="답글" rows="1"></textarea>
<button class="send" id="send" aria-label="보내기"><svg class="i"><use href="#i-enter"/></svg></button>
</div>
<div class="crow">
<div class="l"><button class="ibtn" aria-label="첨부"><svg class="i"><use href="#i-plus"/></svg></button><button class="ibtn" aria-label="음성"><svg class="i"><use href="#i-mic"/></svg></button><button class="ibtn" aria-label="음성 모드"><svg class="i"><use href="#i-wave"/></svg></button></div>
<div class="disc"><b>Concept prototype</b> · Anthropic과 무관한 개인 UX 프로젝트입니다</div>
<div class="r"><span class="model">Opus 5.5 <i>높음</i></span><span>자동</span></div>
</div>
</div>
<aside class="board" id="board">
<div class="bhead">
<h3>핀 보드 <small id="bcount"></small></h3>
<button class="ibtn" id="bExpand" title="크게 보기"><svg class="i"><use href="#i-expand"/></svg></button>
<button class="ibtn" id="bClose" title="닫기"><svg class="i"><use href="#i-x"/></svg></button>
</div>
<div class="blist" id="blist"></div>
<div class="bfoot"><label class="search"><svg class="i"><use href="#i-search"/></svg><input id="bq" placeholder="핀 검색"></label></div>
</aside>
<section class="full" id="full">
<div class="fhead">
<h2>핀 보드<small id="fcount"></small></h2>
<div class="sp"></div>
<label class="search"><svg class="i"><use href="#i-search"/></svg><input id="fq" placeholder="문장·메모 검색"></label>
<button class="ibtn" id="fClose" title="닫기"><svg class="i"><use href="#i-x"/></svg></button>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</section>
</main>
</div>
<!-- desktop selection hint -->
<div class="hint" id="hint"><button id="hintReply">답글<svg class="i"><use href="#i-reply"/></svg></button><span class="sep"></span><button id="hintPin" class="pinb">핀<svg class="i"><use href="#i-pin"/></svg></button></div>
<!-- mobile -->
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer"></nav>
<section class="mmemo" id="mmemo">
<div class="mhead">
<button class="ibtn" id="mmBack" aria-label="메뉴"><svg class="i"><use href="#i-menu"/></svg></button>
<h3>메모</h3>
<button class="ibtn" aria-label="보관함"><svg class="i"><use href="#i-archive"/></svg></button>
</div>
<div class="mlist" id="mlist"></div>
<div class="mfoot"><label class="search"><svg class="i"><use href="#i-search"/></svg><input id="mq" placeholder="검색"></label><button class="ibtn" id="mmNew" aria-label="채팅으로"><svg class="i"><use href="#i-plus"/></svg></button></div>
</section>
<div class="selchip" id="selchip"><button class="go" id="selGo"><svg class="i"><use href="#i-pin"/></svg>메모 +</button><button id="selCancel">취소</button></div>
<div class="handle" id="h1"></div><div class="handle" id="h2"></div>
<div class="toast" id="toast"><span id="toastT"></span><button id="toastB">보기</button></div>
<script src="/content.js?v=8"></script>
<script src="/app.js?v=8"></script>
<script src="/intro.js?v=8"></script>
</body>
</html>
